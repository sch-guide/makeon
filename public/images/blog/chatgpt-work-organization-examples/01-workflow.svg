<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">업무 문서 정리 4단계</title><desc id="desc">원문 익명화, 목적과 형식 지정, AI 초안, 사람 검수 순서</desc>
  <rect width="1440" height="900" rx="42" fill="#fbfaff"/>
  <text x="90" y="105" fill="#241c33" font-family="Arial, sans-serif" font-size="44" font-weight="800">업무 문서를 만드는 4단계</text>
  <text x="90" y="155" fill="#695789" font-family="Arial, sans-serif" font-size="23">AI가 담당하는 구간과 사람이 책임지는 구간을 나눕니다.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(90 245)"><rect width="280" height="420" rx="30" fill="#efe9f8"/><circle cx="60" cy="65" r="30" fill="#725c98"/><text x="50" y="75" fill="#fff" font-size="28" font-weight="800">1</text><text x="35" y="145" fill="#322644" font-size="29" font-weight="800">원문 준비</text><text x="35" y="205" fill="#56466c" font-size="22">개인정보 치환</text><text x="35" y="250" fill="#56466c" font-size="22">사실·추측 분리</text><text x="35" y="295" fill="#56466c" font-size="22">출처 보존</text></g>
    <path d="M385 455h50" stroke="#8b74b2" stroke-width="10"/><path d="m425 435 22 20-22 20" fill="none" stroke="#8b74b2" stroke-width="10"/>
    <g transform="translate(455 245)"><rect width="280" height="420" rx="30" fill="#e6f3ef"/><circle cx="60" cy="65" r="30" fill="#39856c"/><text x="50" y="75" fill="#fff" font-size="28" font-weight="800">2</text><text x="35" y="145" fill="#214b3e" font-size="29" font-weight="800">조건 지정</text><text x="35" y="205" fill="#356554" font-size="22">누구에게 왜</text><text x="35" y="250" fill="#356554" font-size="22">표·길이·순서</text><text x="35" y="295" fill="#356554" font-size="22">추정 금지</text></g>
    <path d="M750 455h50" stroke="#8b74b2" stroke-width="10"/><path d="m790 435 22 20-22 20" fill="none" stroke="#8b74b2" stroke-width="10"/>
    <g transform="translate(820 245)"><rect width="280" height="420" rx="30" fill="#493b63"/><circle cx="60" cy="65" r="30" fill="#b89ce1"/><text x="50" y="75" fill="#241c33" font-size="28" font-weight="800">3</text><text x="35" y="145" fill="#fff" font-size="29" font-weight="800">AI 초안</text><text x="35" y="205" fill="#e4dcef" font-size="22">구조 재배열</text><text x="35" y="250" fill="#e4dcef" font-size="22">문장 다듬기</text><text x="35" y="295" fill="#e4dcef" font-size="22">확인 항목 표시</text></g>
    <path d="M1115 455h50" stroke="#55a88b" stroke-width="10"/><path d="m1155 435 22 20-22 20" fill="none" stroke="#55a88b" stroke-width="10"/>
    <g transform="translate(1185 245)"><rect width="180" height="420" rx="30" fill="#daf2e9" stroke="#55a88b" stroke-width="4"/><circle cx="55" cy="65" r="30" fill="#28735b"/><text x="45" y="75" fill="#fff" font-size="28" font-weight="800">4</text><text x="30" y="145" fill="#214b3e" font-size="28" font-weight="800">사람 검수</text><text x="30" y="205" fill="#356554" font-size="21">사실</text><text x="30" y="250" fill="#356554" font-size="21">어조</text><text x="30" y="295" fill="#356554" font-size="21">최종 책임</text></g>
  </g>
  <rect x="90" y="730" width="1275" height="90" rx="24" fill="#fff" stroke="#ded5ef" stroke-width="3"/>
  <text x="135" y="786" fill="#493b63" font-family="Arial, sans-serif" font-size="26" font-weight="700">완료 기준: 원문에 없는 약속이 없고, 수신자가 해야 할 행동이 분명하며, 사람이 최종 승인했다.</text>
</svg>
