      <g transform="translate(410 620)"><rect x="-115" y="-42" width="230" height="84" rx="42" fill="#fff"/><text y="9" fill="#355c49">코드</text></g>
      <g transform="translate(100 465)"><rect x="-115" y="-42" width="230" height="84" rx="42" fill="#fff"/><text y="9" fill="#654a6b">번역</text></g>
