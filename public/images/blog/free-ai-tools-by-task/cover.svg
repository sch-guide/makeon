<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">작업별 무료 AI 도구 선택</title><desc id="desc">글쓰기, 문서, 이미지, 코딩, 번역 작업에서 도구 종류를 선택하는 지도</desc>
  <rect width="1536" height="960" rx="48" fill="#eef8f5"/>
