<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">AI 이미지 프롬프트 핵심 조건</title><desc id="desc">주제, 구도, 빛, 색, 매체, 용도를 조합하는 도식</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4ec"/><stop offset="1" stop-color="#eee8ff"/></linearGradient></defs>
  <rect width="1536" height="960" rx="48" fill="url(#bg)"/>
  <text x="110" y="140" fill="#8b4f37" font-family="Arial, sans-serif" font-size="30" font-weight="700">MAKEON IMAGE LAB</text>
  <text x="110" y="225" fill="#2d2032" font-family="Arial, sans-serif" font-size="61" font-weight="800">원하는 이미지는</text>
  <text x="110" y="300" fill="#2d2032" font-family="Arial, sans-serif" font-size="61" font-weight="800">조건으로 설명합니다</text>
  <g transform="translate(110 390)" font-family="Arial, sans-serif">
    <rect width="1316" height="390" rx="38" fill="#fff" fill-opacity=".86" stroke="#ead7ce" stroke-width="4"/>
    <g font-size="25" font-weight="800" text-anchor="middle">
      <g transform="translate(75 75)"><circle r="48" fill="#f5c6aa"/><text y="9" fill="#5e3324">주제</text></g>
      <text x="155" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(235 75)"><circle r="48" fill="#d8c9f3"/><text y="9" fill="#473760">장면</text></g>
      <text x="315" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(395 75)"><circle r="48" fill="#c9e5dd"/><text y="9" fill="#285847">구도</text></g>
      <text x="475" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(555 75)"><circle r="48" fill="#ffe29a"/><text y="9" fill="#6e5420">빛</text></g>
      <text x="635" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(715 75)"><circle r="48" fill="#f3c9d7"/><text y="9" fill="#6c3348">색</text></g>
      <text x="795" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(875 75)"><circle r="48" fill="#cedef5"/><text y="9" fill="#2f4d75">매체</text></g>
      <text x="955" y="85" fill="#a97a63" font-size="36">+</text>
      <g transform="translate(1035 75)"><circle r="48" fill="#dce8bd"/><text y="9" fill="#465f20">용도</text></g>
    </g>
    <path d="M120 195h1070" stroke="#d9c9df" stroke-width="5" stroke-linecap="round"/>
    <rect x="180" y="245" width="950" height="90" rx="45" fill="#3e304b"/>
    <text x="655" y="302" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="800" text-anchor="middle">첫 결과를 보고 한 조건씩 수정</text>
  </g>
  <text x="110" y="865" fill="#6b566f" font-family="Arial, sans-serif" font-size="25">형용사를 늘리기보다 결과에서 확인할 요소를 고정하세요.</text>
</svg>
