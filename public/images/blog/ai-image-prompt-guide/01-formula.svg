<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 이미지 프롬프트 조립 공식</title><desc id="desc">장면, 시각 표현, 사용 목적, 제외 조건을 차례로 정하는 공식</desc>
  <rect width="1440" height="900" rx="42" fill="#fffaf7"/>
  <text x="80" y="105" fill="#2d2032" font-family="Arial, sans-serif" font-size="44" font-weight="800">이미지 프롬프트 조립 공식</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 210)"><rect width="290" height="480" rx="32" fill="#ffe2d1"/><text x="35" y="72" fill="#713e2c" font-size="27" font-weight="800">1. 장면</text><text x="35" y="145" fill="#5e3324" font-size="23">주제</text><text x="35" y="195" fill="#5e3324" font-size="23">행동·상태</text><text x="35" y="245" fill="#5e3324" font-size="23">배경</text><rect x="35" y="315" width="220" height="95" rx="18" fill="#fff" fill-opacity=".75"/><text x="55" y="355" fill="#713e2c" font-size="19">무엇이 어디에서</text><text x="55" y="387" fill="#713e2c" font-size="19">무엇을 하는가?</text></g>
    <path d="M390 450h45" stroke="#b98e7b" stroke-width="9"/><path d="m425 432 20 18-20 18" fill="none" stroke="#b98e7b" stroke-width="9"/>
    <g transform="translate(460 210)"><rect width="290" height="480" rx="32" fill="#e8e0f7"/><text x="35" y="72" fill="#4c3a68" font-size="27" font-weight="800">2. 시각 표현</text><text x="35" y="145" fill="#58476f" font-size="23">구도·시점</text><text x="35" y="195" fill="#58476f" font-size="23">빛·색</text><text x="35" y="245" fill="#58476f" font-size="23">매체·질감</text><rect x="35" y="315" width="220" height="95" rx="18" fill="#fff" fill-opacity=".75"/><text x="55" y="355" fill="#4c3a68" font-size="19">화면에서 어떻게</text><text x="55" y="387" fill="#4c3a68" font-size="19">보여야 하는가?</text></g>
    <path d="M770 450h45" stroke="#8873a9" stroke-width="9"/><path d="m805 432 20 18-20 18" fill="none" stroke="#8873a9" stroke-width="9"/>
    <g transform="translate(840 210)"><rect width="240" height="480" rx="32" fill="#dff1eb"/><text x="30" y="72" fill="#285847" font-size="27" font-weight="800">3. 사용 목적</text><text x="30" y="145" fill="#356554" font-size="23">게시 위치</text><text x="30" y="195" fill="#356554" font-size="23">화면 비율</text><text x="30" y="245" fill="#356554" font-size="23">글자 공간</text><rect x="30" y="315" width="180" height="95" rx="18" fill="#fff" fill-opacity=".75"/><text x="50" y="355" fill="#285847" font-size="19">어디에</text><text x="50" y="387" fill="#285847" font-size="19">사용하는가?</text></g>
    <path d="M1100 450h45" stroke="#5c9b83" stroke-width="9"/><path d="m1135 432 20 18-20 18" fill="none" stroke="#5c9b83" stroke-width="9"/>
    <g transform="translate(1170 210)"><rect width="190" height="480" rx="32" fill="#3e304b"/><text x="25" y="72" fill="#fff" font-size="26" font-weight="800">4. 제외</text><text x="25" y="145" fill="#e8dff0" font-size="21">문자</text><text x="25" y="195" fill="#e8dff0" font-size="21">로고</text><text x="25" y="245" fill="#e8dff0" font-size="21">불필요 소품</text><rect x="25" y="315" width="140" height="95" rx="18" fill="#5a496c"/><text x="42" y="355" fill="#fff" font-size="18">무엇을</text><text x="42" y="387" fill="#fff" font-size="18">피할까?</text></g>
  </g>
  <rect x="80" y="750" width="1280" height="85" rx="24" fill="#fff" stroke="#ead7ce" stroke-width="3"/>
  <text x="120" y="803" fill="#713e2c" font-family="Arial, sans-serif" font-size="25" font-weight="700">수정 원칙: 유지할 요소를 먼저 말하고, 이번에 바꿀 조건은 하나만 지정합니다.</text>
</svg>
